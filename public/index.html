<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture Synthesizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      overflow-y: auto;
    }
    #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #start-screen h1 {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 6px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 13px; color: #9ca3af; margin-bottom: 28px; letter-spacing: 2px; }
    .section-label {
      font-size: 10px;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      max-width: 500px;
      width: 90%;
      flex-wrap: wrap;
      justify-content: center;
    }
    .sel-btn {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      background: transparent;
      color: #888;
      border: 1px solid #333;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sel-btn:hover { border-color: #666; color: #ccc; }
    .sel-btn.selected { border-color: #fff; color: #fff; background: rgba(255,255,255,0.06); }
    #start-btn {
      margin-top: 12px;
      padding: 12px 44px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }
    #start-btn:hover { background: rgba(255,255,255,0.08); }
    #start-btn:active { transform: scale(0.97); }
    #start-btn:disabled { border-color: #4b5563; color: #4b5563; cursor: not-allowed; }
    #error-msg {
      margin-top: 12px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 4px;
      color: #ef4444;
      font-size: 11px;
      display: none;
      max-width: 400px;
      text-align: center;
    }
    #loading-indicator {
      margin-top: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      font-size: 12px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* The browser compositor renders the camera below the transparent overlay;
       this avoids copying the full video frame through Canvas2D every render. */
    .camera-feed {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      transform: scaleX(-1);
      background: #000;
      pointer-events: none;
    }
    #main-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      background: transparent;
      display: none;
      pointer-events: none;
    }
    #main-canvas.active { display: block; }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>Gesture Synth</h1>
    <div class="subtitle">High-Performance Gesture Synthesizer</div>

    <div class="section-label">Nota raíz</div>
    <div class="row" id="root-grid"></div>

    <div class="section-label">Octava</div>
    <div class="row" id="octave-grid"></div>

    <div class="section-label">Escala</div>
    <div class="row" id="scale-grid"></div>

    <div class="section-label">Efecto mano izquierda</div>
    <div class="row" id="effect-grid"></div>

    <div class="section-label">Librería de pads</div>
    <div class="row" id="pad-grid"></div>

    <button id="start-btn">Iniciar</button>
    <div id="error-msg"></div>
    <div id="loading-indicator">
      <div class="spinner"></div>
      <span>Inicializando pipeline...</span>
    </div>
  </div>

  <canvas id="main-canvas"></canvas>
  <script type="module" src="/main.js"></script>
</body>
</html>
